<div class="auth-container">
    <h1>{{ title() }}</h1>
    <p>Zaloguj się lub zarejestruj, aby rezerwować miejsca na seanse filmowe.</p>

    <div class="auth-buttons">
        <button pButton icon="pi pi-sign-in" label="Zaloguj się" (click)="loginDialog = true"></button>
        <button pButton icon="pi pi-user-plus" label="Zarejestruj się" class="p-button-outlined" (click)="addingDialog = true"></button>
    </div>
</div>

<p-dialog [(visible)]="addingDialog" [header]="'Rejestracja'" [modal]="true" [styleClass]="'auth-dialog'">
    <ng-template pTemplate="content">
        <div class="form-fields">
            <div class="field">
                <label for="login">Login</label>
                <input type="text" pInputText id="login" [(ngModel)]="newUser.login" placeholder="Wprowadź login" />
            </div>
            <div class="field">
                <label for="haslo">Hasło</label>
                <input type="password" pInputText id="haslo" [(ngModel)]="newUser.haslo" placeholder="Wprowadź hasło" />
            </div>
            <div class="field">
                <label for="imie">Imię</label>
                <input type="text" pInputText id="imie" [(ngModel)]="newUser.imie" placeholder="Wprowadź imię" />
            </div>
            <div class="field">
                <label for="nazwisko">Nazwisko</label>
                <input type="text" pInputText id="nazwisko" [(ngModel)]="newUser.nazwisko" placeholder="Wprowadź nazwisko" />
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" pInputText id="email" [(ngModel)]="newUser.email" placeholder="Wprowadź email" />
            </div>
            <div class="field">
                <label for="telefon">Telefon</label>
                <input type="text" pInputText id="telefon" [(ngModel)]="newUser.telefon" placeholder="Wprowadź telefon" />
            </div>

            <div class="switch-link">
                <span>Masz już konto? <a href="#" (click)="switchToLogin($event)">Zaloguj się tutaj</a></span>
            </div>
        </div>
    </ng-template>

    <ng-template pTemplate="footer">
        <button pButton label="Anuluj" class="p-button-text" (click)="addingDialog = false"></button>
        <button pButton label="Zarejestruj" icon="pi pi-user-plus" (click)="register()"></button>
    </ng-template>
</p-dialog>

<p-dialog [(visible)]="loginDialog" [header]="'Logowanie'" [modal]="true" [styleClass]="'auth-dialog'">
    <ng-template pTemplate="content">
        <div class="form-fields">
            <div class="field">
                <label for="loginUser">Login</label>
                <input type="text" pInputText id="loginUser" [(ngModel)]="user.login" placeholder="Wprowadź login" />
            </div>
            <div class="field">
                <label for="hasloUser">Hasło</label>
                <input type="password" pInputText id="hasloUser" [(ngModel)]="user.haslo" placeholder="Wprowadź hasło" />
            </div>

            <div class="switch-link">
                <span>Nie masz jeszcze konta? <a href="#" (click)="switchToRegister($event)">Zarejestruj się tutaj</a></span>
            </div>
        </div>
    </ng-template>

    <ng-template pTemplate="footer">
        <button pButton label="Anuluj" class="p-button-text" (click)="loginDialog = false"></button>
        <button pButton label="Zaloguj" icon="pi pi-sign-in" (click)="login()"></button>
    </ng-template>
</p-dialog>

<p-toast></p-toast>
