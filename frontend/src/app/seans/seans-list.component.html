<div class="container">
  <h2>Lista seansów</h2>

  <button mat-raised-button color="primary" routerLink="/seanse/nowy">
    Dodaj seans
  </button>

  <table mat-table [dataSource]="seanse" class="mat-elevation-z2" style="margin-top: 20px; width: 100%;">

    
    <ng-container matColumnDef="poster">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let s">
        <img *ngIf="s.okladkaUrl; else noPoster" [src]="'http://localhost:3000/uploads/' + s.okladkaUrl" alt="okladka" style="width:100px;height:100px;object-fit:cover;border-radius:4px;margin-right:8px;vertical-align:middle;margin-top: 5px;margin-bottom: 5px;">
        <ng-template #noPoster>
          <span style="display:inline-block;width:36px;height:36px;background:#e0e0e0;border-radius:4px;margin-right:8px;vertical-align:middle;text-align:center;line-height:36px;color:#666;font-size:16px;">📷</span>
        </ng-template>
      </td>
    </ng-container>

    
    <ng-container matColumnDef="tytul">
      <th mat-header-cell *matHeaderCellDef>Tytuł filmu</th>
      <td mat-cell *matCellDef="let s">{{ s.tytulFilmu }}</td>
    </ng-container>

    
    <ng-container matColumnDef="data">
      <th mat-header-cell *matHeaderCellDef>Data</th>
      <td mat-cell *matCellDef="let s">{{ s.data }}</td>
    </ng-container>

    
    <ng-container matColumnDef="godzina">
      <th mat-header-cell *matHeaderCellDef>Godzina</th>
      <td mat-cell *matCellDef="let s">{{ s.godzinaRozpoczecia }}</td>
    </ng-container>

    
    <ng-container matColumnDef="akcje">
      <th mat-header-cell *matHeaderCellDef>Akcje</th>
      <td mat-cell *matCellDef="let s">
        <button mat-button color="accent" [routerLink]="['/seanse/edytuj', s.id]">
          Edytuj
        </button>

        <button mat-button color="warn" (click)="delete(s.id)">
          Usuń
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['poster','tytul','data','godzina','akcje']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['poster','tytul','data','godzina','akcje']"></tr>
  </table>
</div>
