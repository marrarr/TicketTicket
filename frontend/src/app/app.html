<main class="main">
  <div class="menu">
    <ng-container *ngFor="let btn of buttons">
      <button *ngIf="canShowButton(btn)"
              pButton
              type="button"
              [label]="btn.label"
              [icon]="btn.icon"
              (click)="openLink(btn)">
      </button>
    </ng-container>
  </div>
  <div class="header">

  </div>

  <div class="header-right">
    <span *ngIf="userRole">Zalogowany jako: {{userRole}} : {{userName}}</span>
  </div>
  

  <div class="content">
    <router-outlet></router-outlet>
  </div>
</main>
